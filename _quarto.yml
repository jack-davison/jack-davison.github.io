project:
  type: website
  output-dir: docs

website:
  title: Jack Davison
  description: Data specialist, open-source developer and technical educator, with a background in air quality and environmental analytics.
  repo-url: https://github.com/jack-davison/jack-davison.github.io
  open-graph: true
  site-url: https://jack-davison.github.io/
  image: style/social-card.png
  favicon: style/favicon.png
  search: false
  twitter-card:
    card-style: summary_large_image
  navbar:
    title: Jack Davison
    right:
      - text: "Work"
        file: work.qmd
      - icon: github
        href: https://github.com/jack-davison
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/jack-davison/
        aria-label: LinkedIn
      - icon: bluesky
        href: https://bsky.app/profile/jack-davison.bsky.social
        aria-label: Bluesky
  page-footer:
    left: |
      Made with [Quarto](https://quarto.org/)
    right: |
      [Source on GitHub](https://github.com/jack-davison/jack-davison.github.io)

format:
  html:
    toc: false
    anchor-sections: true
    respect-user-color-scheme: true
    theme:
      light: style/light.scss
      dark: style/dark.scss
    css: style/styles.css
