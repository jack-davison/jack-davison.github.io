# Everything shown on the Work page, in display order.
# `featured: "yes"` also puts an item in "Selected work" on the home page.

# --- Software -----------------------------------------------------------------

- title: "{openair}"
  description: |
    The long-standing R toolkit for air quality analysis. Core maintainer and
    second-largest contributor, modernising its code and API.
  path: https://openair-project.github.io/openair/
  image: img/openair.png
  categories: [Software]
  featured: "yes"

- title: "{openairmaps}"
  description: |
    Lead developer. Combines openair's analysis with interactive leaflet maps,
    most notably putting bivariate polar plots on maps for source
    triangulation.
  path: https://openair-project.github.io/openairmaps/
  image: img/openairmaps.png
  categories: [Software]
  featured: "yes"

- title: "{worldmet}"
  description: |
    Co-maintainer. Downloads and tidies global surface meteorological
    observations from NOAA's meteorology database, ready for use
    with openair.
  path: https://openair-project.github.io/worldmet/
  image: img/worldmet.png
  categories: [Software]

- title: "{deweather}"
  description: |
    Co-maintainer. Uses statistical models to remove the influence of
    meteorology from air quality time series, revealing underlying trends.
  path: https://openair-project.github.io/deweather/
  image: img/deweather.png
  categories: [Software]

- title: "{ukaq} and {euroaq}"
  description: |
    Author. Lightweight R packages for accessing UK and European Environment
    Agency air quality data.
  path: https://openair-project.github.io/ukaq/
  image: img/ukaq.png
  categories: [Software]

- title: "{leaf.magic}"
  description: |
    Author. Builds customisable leaflet markers from modern icon libraries
    (Font Awesome, Bootstrap, Lucide, Ionicons) in any colour and size, with
    matching legends.
  path: https://jack-davison.github.io/leaf.magic/
  image: img/leaf.magic.png
  categories: [Software]
  featured: "yes"

# --- Apps ---------------------------------------------------------------------

- title: "UK AIR Local Air Quality Dashboard"
  description: |
    A public Shiny dashboard for Defra. Enter a postcode to see local
    monitoring data, compliance, Air Quality Management Areas and council
    action plans for any UK local authority.
  path: https://uk-air.defra.gov.uk/local-authorities-dashboard/
  image: img/la-dashboard.png
  categories: [Apps]
  featured: "yes"

# --- Reports ------------------------------------------------------------------

- title: "UK Hydrocarbons Network Annual Report 2024"
  description: |
    A Quarto report published by Defra each year, summarising
    measurements of benzene and other VOCs and tracking compliance with
    the Air Quality Directive.
  path: https://uk-air.defra.gov.uk/assets/documents/reports/cat05/2509300440_UK_Hydrocarbons_Network_Annual_Report_2024.html
  image: img/hydrocarbons-2022.png
  categories: [Reports]

- title: "UK Summer 2023 Ozone Episode"
  description: |
    A rapid-turnaround report on a protracted summer ozone episode, using
    then-new features in {gt} and {bslib}.
  path: https://www.ricardo.com/media/zfcbzfuh/2023-summer-ozone-episode.html
  image: img/ozone-2023.png
  categories: [Reports]

- title: "Air Quality on Bonfire Night 2023"
  description: |
    Particulate pollution on Bonfire Night, and how well the Daily Air Quality
    Index works for short-lived events.
  path: https://www.ricardo.com/media/yssjq543/2023-bonfire-night.html
  image: img/bonfire-2023.jpg
  categories: [Reports]

- title: "West London Particulate Episode 2023"
  description: |
    An episode report with interactive leaflet maps, styled {gt} tables and
    {ggplot2} figures.
  path: https://www.ricardo.com/media/c33dncxa/west-london-particulate-episode.html
  image: img/west-london-2023.png
  categories: [Reports]

